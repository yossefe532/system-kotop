name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: educon_pos
          POSTGRES_USER: educon_pos
          POSTGRES_PASSWORD: educon_pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U educon_pos -d educon_pos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: pos-frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: pos-frontend
        run: npm ci

      - name: Run backend lint-free validation
        run: python -m compileall app auth tests main.py database.py models.py schemas.py

      - name: Run frontend lint
        working-directory: pos-frontend
        run: npm run lint

      - name: Run backend tests
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://educon_pos:educon_pos@localhost:5432/educon_pos
          JWT_SECRET_KEY: ci-secret
          CORS_ALLOWED_ORIGINS: http://localhost:5173
          TRUSTED_HOSTS: localhost,127.0.0.1
          INIT_ADMIN_USERNAME: admin
          INIT_ADMIN_PASSWORD: admin12345
          SCHEMA_GUARD_DISABLED: "1"
        run: pytest

      - name: Run frontend tests
        working-directory: pos-frontend
        run: npm run test:coverage

      - name: Build frontend
        working-directory: pos-frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build

      - name: Build backend Docker image
        run: docker build -f Dockerfile.backend -t educon-pos-backend:${{ github.sha }} .

      - name: Build frontend Docker image
        run: docker build -f Dockerfile.frontend --build-arg VITE_API_BASE_URL=https://api.example.com -t educon-pos-frontend:${{ github.sha }} .

  deploy-staging:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        run: |
          echo "Integrate this step with your staging platform deployment command."
          echo "Recommended: deploy backend, run migrations, verify /health/ready, then deploy frontend."
      - name: Verify staging health
        run: |
          test -n "${STAGING_HEALTHCHECK_URL}"
          curl --fail --retry 10 --retry-delay 5 "${STAGING_HEALTHCHECK_URL}"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: |
          echo "Integrate this step with your production platform deployment command."
          echo "Recommended: blue/green or rolling deployment with migration pre-step."
      - name: Verify production health
        run: |
          test -n "${PRODUCTION_HEALTHCHECK_URL}"
          curl --fail --retry 12 --retry-delay 5 "${PRODUCTION_HEALTHCHECK_URL}"
